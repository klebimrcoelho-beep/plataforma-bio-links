<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meus Links | Bio</title>
  <meta name="description" content="Todos os meus links em um só lugar." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .bg-glow::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(600px circle at 20% 10%, rgba(139,92,246,.25), transparent 60%),
        radial-gradient(500px circle at 80% 90%, rgba(236,72,153,.18), transparent 60%);
    }
    .link-btn { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
    .link-btn:hover { transform: scale(1.03); border-color: rgba(167,139,250,.7); box-shadow: 0 0 25px rgba(139,92,246,.35); }
    .link-btn:active { transform: scale(.98); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .fade-up { animation: fadeUp .5s ease both; }
    .skeleton { background: linear-gradient(90deg,#1f1f2b 25%,#2a2a3a 50%,#1f1f2b 75%); background-size: 200% 100%; animation: sh 1.4s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
  </style>
</head>
<body class="bg-glow min-h-screen bg-[#0b0b12] text-zinc-100 antialiased">
  <main class="mx-auto flex w-full max-w-md flex-col items-center px-5 py-14">
    <header id="perfil" class="invisible mb-8 flex flex-col items-center text-center fade-up">
      <div id="avatar" class="flex h-28 w-28 items-center justify-center overflow-hidden rounded-full border-2 border-violet-500/70 bg-zinc-800 p-1 shadow-[0_0_30px_rgba(139,92,246,.4)] text-3xl font-bold"></div>
      <h1 id="usuario" class="mt-4 text-xl font-semibold"></h1>
      <p id="handle" class="text-xs text-violet-400"></p>
      <p id="bio" class="mt-2 text-sm text-zinc-400"></p>
    </header>

    <section id="erro" class="fade-up mt-16 hidden w-full rounded-3xl border border-white/10 bg-white/5 p-8 text-center backdrop-blur">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-violet-500/15 text-2xl text-violet-400">
        <i class="fa-solid fa-user-slash"></i>
      </div>
      <h2 id="erro-titulo" class="text-xl font-semibold"></h2>
      <p id="erro-texto" class="mt-2 text-sm text-zinc-400"></p>
    </section>

    <nav id="links" class="flex w-full flex-col gap-4" aria-label="Links">
      <div class="skeleton h-14 w-full rounded-2xl"></div>
      <div class="skeleton h-14 w-full rounded-2xl"></div>
      <div class="skeleton h-14 w-full rounded-2xl"></div>
    </nav>

    <footer class="w-full pt-12 text-center text-sm text-gray-500">
      Feito por
      <a href="https://api.whatsapp.com/send?phone=5527992510018"
         target="_blank" rel="noopener noreferrer"
         class="transition-colors duration-300 hover:text-violet-400">Conexão Web Designer &amp; Desenvolvedor</a>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
